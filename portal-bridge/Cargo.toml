[package]
name = "mwb-portal-bridge"
version = "0.5.5"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
ashpd = { version = "=0.13.13", default-features = false, features = ["input_capture", "remote_desktop", "screencast", "tokio"] }
futures-util = "=0.3.33"
reis = { version = "=0.5.0", features = ["tokio"] }
rustix = { version = "=0.38.44", features = ["time"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = "thin"
strip = true
